{% extends 'base.html' %}

{% block title %}Delete {{ place.name }} | LocalScout{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-16">
    <div class="rounded-3xl border border-rose-200 bg-white p-8 text-center shadow-sm">
        <h1 class="text-2xl font-black text-slate-900">Delete {{ place.name }}?</h1>
        <p class="mt-3 text-sm text-slate-600">This action cannot be undone.</p>
        <form method="POST" class="mt-8 flex justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'profile' %}" class="rounded-xl bg-slate-100 px-5 py-3 text-sm font-bold text-slate-700">Cancel</a>
            <button type="submit" class="rounded-xl bg-red-600 px-5 py-3 text-sm font-bold text-white">Delete Place</button>
        </form>
    </div>
</div>
{% endblock %}
