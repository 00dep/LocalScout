{% load static %}
<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            
            <!-- Brand Logo -->
            <div class="flex-shrink-0 flex items-center">
                <a href="{% url 'home' %}" class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
                        <i class="fa-solid fa-compass text-lg"></i>
                    </div>
                    <span class="text-lg font-black tracking-tight text-slate-900">Local<span class="text-orange-600">Scout</span></span>
                </a>
            </div>

            <!-- Desktop Navigation Links -->
            <div class="hidden md:flex items-center gap-1 lg:gap-2">
                <a href="{% url 'home' %}" class="px-3.5 py-2 rounded-xl text-xs font-bold transition {% if request.path == '/' %}bg-orange-50 text-orange-600{% else %}text-slate-600 hover:text-orange-600 hover:bg-slate-50{% endif %}">
                    Home
                </a>
                <!-- আপনার অন্যান্য নেভিগেশন লিংক এখানে যোগ করতে পারেন -->
            </div>

            <!-- Desktop Right Actions (Auth State) -->
            <div class="hidden md:flex items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-xs font-bold text-slate-700">Hi, {{ user.username }}</span>
                    
                    <!-- Secure Logout POST Form -->
                    <form action="{% url 'logout' %}" method="POST" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 transition">
                            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="px-4 py-2 text-xs font-bold text-slate-700 hover:text-orange-600 transition">Log In</a>
                    <a href="{% url 'register' %}" class="px-4 py-2 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-xs font-bold rounded-xl shadow-md transition">
                        Sign Up
                    </a>
                {% endif %}
            </div>

            <!-- Mobile Menu Toggle Button -->
            <div class="flex md:hidden items-center">
                <button id="mobile-menu-button" type="button" aria-expanded="false" class="p-2 rounded-xl text-slate-600 hover:text-orange-600 hover:bg-slate-100 transition focus:outline-none">
                    <span class="sr-only">Open main menu</span>
                    <!-- Hamburger Icon -->
                    <svg id="menu-icon-open" class="h-6 w-6 block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <!-- Close Icon (Hidden by default) -->
                    <svg id="menu-icon-close" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

        </div>
    </div>

    <!-- Mobile Menu Drawer / Dropdown -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 bg-white px-4 pt-3 pb-5 space-y-2 shadow-xl">
        <a href="{% url 'home' %}" class="block px-3 py-2.5 rounded-xl text-xs font-bold {% if request.path == '/' %}bg-orange-50 text-orange-600{% else %}text-slate-700 hover:bg-slate-50{% endif %}">
            Home
        </a>

        <div class="pt-3 border-t border-slate-100 flex flex-col gap-2">
            {% if user.is_authenticated %}
                <div class="px-3 py-1 text-xs font-bold text-slate-500">Logged in as {{ user.username }}</div>
                <form action="{% url 'logout' %}" method="POST" class="w-full">
                    {% csrf_token %}
                    <button type="submit" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 transition">
                        <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Logout
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="block text-center px-4 py-2.5 rounded-xl text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition">Log In</a>
                <a href="{% url 'register' %}" class="block text-center px-4 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-orange-500 to-amber-500 shadow-md">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- JavaScript for Mobile Menu & State Toggle -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('menu-icon-open');
        const iconClose = document.getElementById('menu-icon-close');

        if (btn && menu) {
            btn.addEventListener('click', function () {
                const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', !isExpanded);
                
                // Toggle Menu Visibility
                menu.classList.toggle('hidden');
                
                // Toggle Icons
                iconOpen.classList.toggle('hidden');
                iconClose.classList.toggle('hidden');
            });
        }
    });
</script>
